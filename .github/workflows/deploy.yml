name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Svarbu: atšaukti tik "build" žingsnius, bet leisti pabaigti jau prasidėjusį "deploy"
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      # (Papildoma) Žingsnis patikrinti, kur tiksliai sugeneruoti failai
      - name: List build directory
        run: ls -la dist/kelyje

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Jei dist/kelyje viduje YRA browser papildomas katalogas, palikite: dist/kelyje/browser
          # Jei index.html yra tiesiai dist/kelyje, pakeiskite į: dist/kelyje
          path: dist/kelyje/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4