<div class="page">
  <main class="stage">
    <div class="shell-stage">
      <section class="shell" role="group" aria-label="Racija">
        <img
          class="slice slice-top"
          ngSrc="radio/shell-top.webp"
          width="556"
          height="272"
          alt=""
          priority
          draggable="false"
        />
        <div
          class="slice slice-mid"
          aria-hidden="true"
          style="background-image: url('radio/shell-mid.webp')"
        ></div>
        <img
          class="slice slice-bottom"
          ngSrc="radio/shell-bottom.webp"
          width="556"
          height="744"
          alt=""
          draggable="false"
        />

        <h1 class="logo-h1">RACIJA</h1>

        <app-lcd-screen
          [sounds]="sounds()"
          [selectedId]="selectedId()"
          [playingId]="playingId()"
          [loadingId]="loadingId()"
          [voice]="voice()"
          [query]="query()"
          [mode]="mode()"
          (soundSelect)="onRow($event)"
          (voiceChange)="onVoice($event)"
          (queryChange)="onQuery($event)"
        >
          @if (mode() === 'create') {
            <app-tts-panel
              kurti
              [text]="text()"
              [canAct]="canAct()"
              [playing]="speaking()"
              [again]="again()"
              [problem]="problem()"
              (textChange)="onText($event)"
              (play)="onPlayText()"
              (overflow)="onTextOverflow()"
            />
          }
        </app-lcd-screen>

        <button type="button" class="skey pill" (click)="onMode($event)">
          {{ mode() === 'sounds' ? 'KURTI' : 'GARSAI' }}
        </button>
        <button
          #shareButton
          type="button"
          class="skey round"
          [attr.aria-disabled]="mode() === 'sounds' ? !selected() : !canAct()"
          [attr.aria-busy]="sharing() || (mode() === 'create' && generating()) ? 'true' : null"
          [attr.data-steady]="mode() === 'create' && again() ? '' : null"
          (click)="onSend()"
        >
          SIŲSTI
        </button>
      </section>
    </div>

    <div class="furniture">
      @if (!played()) {
        <p class="chip hint hidden coarse:inline-flex">
          <svg viewBox="0 0 12 10" aria-hidden="true">
            <path d="M0 3h3l3-3v10L3 7H0z M8 2h1v6H8z M10 0h1v10h-1z" />
          </svg>
          Įjunkite garsą
        </p>
      }
      <p class="chip counters">
        <span class="whitespace-nowrap"
          >Paleista: <b class="num">{{ playsText() }}</b></span
        >
        ·
        <span class="whitespace-nowrap"
          >Išsiųsta: <b class="num">{{ sharesText() }}</b></span
        >
      </p>
      <footer class="chip note">Fanų projektas, nesusijęs su žaidimo kūrėjais</footer>
    </div>
  </main>
</div>

<div class="sr-only" role="status" aria-live="polite" aria-atomic="true">{{ live() }}</div>

@if (toast(); as t) {
  <div class="toast-wrap" aria-hidden="true">
    <div class="toast" [class.err]="t.error">{{ t.text }}</div>
  </div>
}
