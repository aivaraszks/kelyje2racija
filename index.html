        (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)
      ) {
        const vp = document.querySelector('meta[name="viewport"]');
        vp.setAttribute('content', vp.getAttribute('content') + ', maximum-scale=1');
      }
    </script>
