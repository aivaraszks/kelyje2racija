  <rect x="1016" y="426" width="84" height="44" rx="22" fill="url(#key)" stroke="#646b74" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13" fill="#1b1f24" text-anchor="middle" letter-spacing=".5">
    <text x="862" y="453">PAIEŠKA</text><text x="1058" y="453">SIŲSTI</text>
  </g>
  <circle cx="960" cy="452" r="48" fill="#11161b"/>
  <circle cx="960" cy="452" r="41" fill="none" stroke="#4df07f" stroke-width="5"/>
  <circle cx="960" cy="452" r="34" fill="url(#go)"/>
  <path d="M955 440h4v4h4v4h4v4h-4v4h-4v4h-4z" transform="translate(-3 -6)" fill="#1b1f24" shape-rendering="crispEdges"/>
  <text x="960" y="470" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13" fill="#1b1f24" text-anchor="middle" letter-spacing=".5">PRIIMTI</text>
  <!-- grille -->
  <rect x="820" y="518" width="280" height="38" rx="12" fill="#aeb4bc"/>
  <rect x="824" y="522" width="272" height="30" rx="8" fill="url(#dots)"/>
</svg>
